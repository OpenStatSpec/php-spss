name: QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [locked, lowest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, mbstring
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --prefer-dist

      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --prefer-dist --prefer-lowest

      - name: Run QA
        run: composer qa
