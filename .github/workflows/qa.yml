name: QA

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }} dependencies
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [locked, lowest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, mbstring, zlib
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --prefer-dist

      - name: Install lowest supported dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --no-interaction --prefer-dist --prefer-lowest

      - name: Run locked dependency QA
        if: matrix.dependencies == 'locked'
        run: composer qa

      - name: Run lowest dependency compatibility QA
        if: matrix.dependencies == 'lowest'
        run: composer qa:lowest

  # PHP 8.3 is a supported runtime; static analysis and tooling gates run on 8.4+ where PHPUnit 13 is available.
  php83-runtime:
    name: PHP 8.3 / lowest dependencies runtime
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, zlib
          coverage: none
          tools: composer:v2

      - name: Install lowest supported dependencies for PHP 8.3
        run: |
          composer config platform.php 8.3.0
          composer update --no-interaction --prefer-dist --prefer-lowest

      - name: Run syntax and unit tests
        run: |
          composer test:syntax
          composer test:unit

  quality-gates:
    name: Coverage and mutation gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, zlib
          coverage: xdebug
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Enforce line coverage
        run: composer test:coverage

      - name: Enforce branch coverage
        run: composer test:coverage:branch

      - name: Enforce mutation score
        run: composer test:mutation

  interoperability:
    name: R/haven SAV and ZSAV interoperability
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, mbstring, zlib
          coverage: none
          tools: composer:v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install haven
        run: install.packages("haven")
        shell: Rscript {0}

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run bidirectional interoperability gate
        run: composer test:interop
